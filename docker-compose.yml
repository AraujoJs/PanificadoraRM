services:
  web:
    build: .
    container_name: panificadorarm_web
    restart: always
    expose:
      - "5000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - VIRTUAL_PORT=5000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net
      - proxy_net

  db:
    image: postgres:15-alpine
    container_name: panificadorarm_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d panificadorarm_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_net

volumes:
  pgdata:

networks:
  app_net:
    driver: bridge
  proxy_net:
    external: true
